<div class="app-container">
  <app-header></app-header>
  <app-sidenav></app-sidenav>
  <div class="content">
    <div class="detalhes-container" *ngIf="evento">
      <button class="voltar-btn" (click)="voltar()">← Voltar</button>
      
      <h1 class="titulo-evento">{{ evento.titulo }}</h1>
      
      <div class="detalhes-content">
        <div class="imagem-container">
          <button class="seta" *ngIf="evento.imagens && evento.imagens.length > 0 && evento.imagemAtual! > 0" (click)="anteriorMidia()">◀</button>
          
          <ng-container *ngIf="evento.imagens && evento.imagens.length > 0 && evento.imagemAtual !== undefined">
            <img *ngIf="isImage(evento.imagens[evento.imagemAtual!])"
                 [src]="'http://localhost:3000/' + evento.imagens[evento.imagemAtual!]"
                 alt="Mídia do Evento" class="imagem-evento" />

            <video *ngIf="isVideo(evento.imagens[evento.imagemAtual!])"
                   [src]="'http://localhost:3000/' + evento.imagens[evento.imagemAtual!]"
                   controls
                   loop
                   preload="metadata"
                   class="video-evento"> Seu navegador não suporta a tag de vídeo.
            </video>
          </ng-container>
          
          <div *ngIf="!evento.imagens || evento.imagens.length === 0" class="imagem-placeholder">
            <span>Sem mídia</span>
          </div>

          <button class="seta" *ngIf="evento.imagens && evento.imagens.length > 0 && evento.imagemAtual! < evento.imagens.length - 1" (click)="proximaMidia()">▶</button>
        </div>
        
        <div class="info-container">
          <div class="endereco-container">
            <span class="pin-icon">📍</span>
            <p class="endereco">{{ evento.local }}</p>
          </div>
          
          <div id="map" class="map-container" *ngIf="mapReady"></div>
          
          <div class="descricao-container">
            <h2>Descrição</h2>
            <p class="descricao">{{ evento.descricao }}</p>
          </div>
          
          <div *ngIf="evento.ongs" class="ongs-container">
            <h2>ONGs participantes</h2>
            <ul class="ongs-lista">
              <li *ngFor="let ong of parseOngs(evento.ongs)">{{ ong }}</li>
            </ul>
          </div>
          
          <div *ngIf="evento.contato" class="contato-container">
            <h2>Contato</h2>
            <p class="contato">{{ evento.contato }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
